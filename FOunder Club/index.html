<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Club Azerbaijan</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0a192f; --gold: #d4af37; --white: #ffffff; --light: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--primary); }
        nav { background: rgba(10, 25, 47, 0.95); padding: 15px 8%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; z-index: 1000; backdrop-filter: blur(10px); }
        .logo img { height: 50px; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: white; font-weight: 500; transition: 0.3s; }
        nav ul li a:hover { color: var(--gold); }
        .hero { height: 100vh; background: linear-gradient(rgba(10, 25, 47, 0.6), rgba(10, 25, 47, 0.6)), url('img/sl1.jpg') no-repeat center center/cover; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .hero-content h1 { font-family: 'Montserrat'; font-size: 3.5rem; margin-bottom: 20px; }
        .hero-content span { color: var(--gold); }
        .board-section { padding: 80px 8%; background: var(--white); text-align: center; }
        .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 50px; }
        .board-card { background: var(--light); border-radius: 10px; overflow: hidden; transition: 0.3s; border-bottom: 4px solid transparent; }
        .board-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .board-card img { width: 100%; height: 250px; object-fit: cover; }
        .board-info { padding: 15px; }
        footer { background: var(--primary); color: white; padding: 40px; text-align: center; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><img src="img/logo.png" alt="Founder Club"></div>
        <ul>
            <li><a href="index.html">Ana Səhifə</a></li>
            <li><a href="haqqinda.html">Haqqımızda</a></li>
            <li><a href="#board">Məşvərət Heyəti</a></li>
        </ul>
    </nav>
    <section class="hero">
        <div class="hero-content">
            <h1>Founder Club <span>Azerbaijan</span></h1>
            <p>Sahibkarlıq ekosisteminin mərkəzində yerinizi alın.</p>
        </div>
    </section>
    <section id="board" class="board-section">
        <h2 style="font-family: 'Montserrat'; font-size: 2.5rem;">Məşvərət Heyəti</h2>
        <div class="board-grid">
            <div class="board-card"><img src="img/tm1.jpg" alt="1"><div class="board-info"><h3>Üzv 1</h3><p>Founder</p></div></div>
            <div class="board-card"><img src="img/tm2.jpg" alt="2"><div class="board-info"><h3>Üzv 2</h3><p>Founder</p></div></div>
            <div class="board-card"><img src="img/tm3.jpg" alt="3"><div class="board-info"><h3>Üzv 3</h3><p>Founder</p></div></div>
            <div class="board-card"><img src="img/tm4.jpg" alt="4"><div class="board-info"><h3>Üzv 4</h3><p>Founder</p></div></div>
            <div class="board-card"><img src="img/tm5.jpg" alt="5"><div class="board-info"><h3>Üzv 5</h3><p>Founder</p></div></div>
            <div class="board-card"><img src="img/tm6.jpg" alt="6"><div class="board-info"><h3>Üzv 6</h3><p>Founder</p></div></div>
        </div>
    </section>
    <footer><p>&copy; 2026 Founder Club Azerbaijan.</p></footer>
</body>
</html>
